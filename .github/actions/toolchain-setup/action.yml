name: Kotlin Toolchain setup
description: Set up Java 21 for native desktop packaging and the pinned Kotlin wrapper
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@v5
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        distribution: jetbrains
        java-version: '21'
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/JetBrains/Kotlin
          ~/Library/Caches/JetBrains/Kotlin
          ~/AppData/Local/JetBrains/Kotlin
        key: kotlin-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', 'kotlin.bat', '**/module.yaml', '**/*.module-template.yaml', 'gradle/libs.versions.toml') }}
        restore-keys: kotlin-toolchain-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: chmod +x kotlin && ./kotlin --version
